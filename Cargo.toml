[package]
name = "rust-webtransport-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
wtransport = "0.6.1"
tokio = { version = "1.28.1", default-features = false, features = ["macros", "io-util", "rt-multi-thread", "sync"] }
anyhow = "1.0.71"
dashmap = "6.1.0"
serde = { version = "1.0", features = ["derive"] }
rmpv = { version = "1.3", features = ["with-serde"] }
rmp-serde = "1.3"
uuid = { version = "1", features = ["serde", "v4"] }
